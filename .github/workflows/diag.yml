name: DOM 诊断

on:
  workflow_dispatch:  # 仅手动触发

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: user-data
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Install browser
        run: playwright install chromium --with-deps --only-shell

      - name: Run DOM diagnostic
        env:
          TASKS: ${{ vars.TASKS }}
          COOKIES_USER1: ${{ secrets.COOKIES_USER1 }}
          MATCH_MODE: ${{ vars.MATCH_MODE }}
          LOG_LEVEL: "INFO"
        run: python diag_dom.py

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-dom
          path: logs/
