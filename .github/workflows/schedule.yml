name: DouYin Spark AI - 每日续火花

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: "0 1 * * *"  # UTC 1:00 = 北京时间 9:00

jobs:
  spark:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: user-data

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Douyin accessibility
        run: |
          echo "检测抖音创作者中心是否可达..."
          curl -sI --max-time 15 https://creator.douyin.com/ | head -1
          echo "检测完成"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Install browser
        run: playwright install chromium --with-deps --only-shell

      - name: Run Spark AI
        env:
          TASKS: ${{ vars.TASKS }}
          COOKIES_USER1: ${{ secrets.COOKIES_USER1 }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          MATCH_MODE: ${{ vars.MATCH_MODE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          LOG_LEVEL: "INFO"
        run: python main.py

      - name: Auto-refresh Cookie Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT，跳过 cookie 自动回写（不影响本次运行）"
            exit 0
          fi
          shopt -s nullglob
          files=(logs/fresh_cookies_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有抓取到新登录态（可能登录失效或未运行），跳过回写"
            exit 0
          fi
          for f in "${files[@]}"; do
            uid=$(basename "$f" .json | sed 's/^fresh_cookies_//')
            secret_name="COOKIES_$(echo "$uid" | tr '[:lower:]' '[:upper:]')"
            echo "回写 $secret_name ← $f"
            gh secret set "$secret_name" --env user-data --body "$(cat "$f")"
          done
          echo "cookie 已自动续期"

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-logs
          path: logs/

  # 防止 GitHub 60 天不活跃自动禁用 workflow
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
