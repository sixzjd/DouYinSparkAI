name: DouYin Spark AI - 每日续火花

on:
  workflow_dispatch:  # 手动触发
  schedule:
    # 定时任务实际触发会比 cron 晚 1~5 小时（GitHub 排队机制），
    # 故提前到 UTC 6:00 排队，启动后 sleep 到 UTC 11:00（北京 19:00）再执行
    - cron: "0 6 * * *"

jobs:
  spark:
    # 总开关：仓库变量 SPARK_ENABLED=false 时整个任务跳过（不启动浏览器）。
    # 用 != 'false' 保证变量未设置时默认运行（向后兼容）。
    # keepalive 任务不受影响，暂停期间 workflow 仍保活。
    if: vars.SPARK_ENABLED != 'false'
    # 最坏情况：排队延迟 5 小时 + 等待 5 小时 + 任务本身
    timeout-minutes: 660
    runs-on: ubuntu-latest
    environment: user-data
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # GitHub 定时器延迟严重（实测晚 4~6 小时），无法准点。
      # 仓库是 public、Actions 免费，用"提前排队 + 等到点"保证北京时间 19:00 前后执行；
      # 若排队延迟导致已过 19:00，则立即执行（宁可晚不可早）。
      # 手动触发时跳过等待，立即执行。
      - name: Wait until 19:00 Beijing (UTC 11:00)
        if: github.event_name == 'schedule'
        run: |
          target=$(date -u -d "today 11:00" +%s)
          now=$(date +%s)
          wait_sec=$((target - now))
          if [ $wait_sec -le 0 ]; then
            echo "已过 UTC 11:00，立即执行"
            exit 0
          fi
          if [ $wait_sec -gt 18000 ]; then
            echo "等待时间超过 5 小时上限，截断为 5 小时"
            wait_sec=18000
          fi
          echo "等待 ${wait_sec}s 后开始执行"
          sleep $wait_sec

      - name: Test Douyin accessibility
        run: |
          echo "检测抖音创作者中心是否可达..."
          curl -sI --max-time 15 https://creator.douyin.com/ | head -1
          echo "检测完成"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Install browser
        run: playwright install chromium --with-deps --only-shell

      - name: Run Spark AI
        env:
          TASKS: ${{ vars.TASKS }}
          COOKIES_USER1: ${{ secrets.COOKIES_USER1 }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          MATCH_MODE: ${{ vars.MATCH_MODE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          STYLE_PROFILE: ${{ secrets.STYLE_PROFILE }}
          LOG_LEVEL: "INFO"
        run: python main.py

      - name: Auto-refresh Cookie Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT，跳过 cookie 自动回写（不影响本次运行）"
            exit 0
          fi
          shopt -s nullglob
          files=(logs/fresh_cookies_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有抓取到新登录态（可能登录失效或未运行），跳过回写"
            exit 0
          fi
          for f in "${files[@]}"; do
            uid=$(basename "$f" .json | sed 's/^fresh_cookies_//')
            secret_name="COOKIES_$(echo "$uid" | tr '[:lower:]' '[:upper:]')"
            echo "回写 $secret_name ← $f"
            # 写仓库级 Secret（非环境级）：fine-grained 令牌的 Secrets 权限
            # 只覆盖仓库级，写环境级会 HTTP 403。COOKIES_* 须建在仓库级。
            gh secret set "$secret_name" --body "$(cat "$f")"
          done
          echo "cookie 已自动续期"

      # 登录态过期告警：正常成功运行一定会抓到 fresh_cookies（即使没发消息）。
      # 没抓到 = 登录已失效，自动续期循环断了，需要人工扫码。
      # 开 issue 通知（同名未关闭 issue 已存在则跳过，避免每天重复开）。
      - name: Alert if login expired
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          if compgen -G "logs/fresh_cookies_*.json" > /dev/null; then
            echo "本次抓到了新登录态，续期循环正常"
            # 登录恢复后自动关闭之前的告警 issue
            open_issue=$(gh issue list --state open --label login-expired --json number --jq '.[0].number' || true)
            if [ -n "$open_issue" ]; then
              echo "登录已恢复，关闭告警 issue #$open_issue"
              gh issue close "$open_issue" --comment "登录态已自动恢复，续期循环正常。"
            fi
            exit 0
          fi
          echo "⚠️ 未抓到新登录态，登录可能已过期"
          existing=$(gh issue list --state open --label login-expired --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "告警 issue #$existing 已存在，不重复创建"
            exit 0
          fi
          gh label create login-expired --color D93F0B --description "抖音登录态过期" 2>/dev/null || true
          body=$(cat <<'BODY'
          本次运行没有抓到任何新登录态（logs/fresh_cookies_*.json 不存在），说明 Secret 里的登录凭证已失效，cookie 自动续期循环中断，火花会就此断掉。

          **恢复步骤（任意一台电脑）：**
          1. 克隆本仓库，`pip install -r requirements.txt && python -m playwright install chromium`
          2. 运行 `python get_cookies.py`，用手机抖音扫码登录，会生成 `auth_state.json`
          3. 回写 Secret：`gh secret set COOKIES_USER1 --repo sixzjd/DouYinSparkAI --body "$(cat auth_state.json)"`
          4. 到 Actions 手动触发一次「DouYin Spark AI - 每日续火花」确认恢复

          恢复后本 issue 会在下次成功运行时自动关闭。
          BODY
          )
          gh issue create \
            --label login-expired \
            --title "⚠️ 抖音登录态过期，续火花已停摆，需扫码重新登录" \
            --body "$body"

      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-logs
          path: logs/

  # 防止 GitHub 60 天不活跃自动禁用 workflow
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1